name: SentinelForge AI Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-security-evaluation:
    name: Automated AI Red-Teaming & Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyrit garak
          npm install -g promptfoo

      - name: Run automated unit tests
        run: |
          python -m pytest tests/ -v

      - name: Execute Regression Suite (Promptfoo)
        env:
          DEFENSE_MODE: defense_in_depth
        run: |
          python main.py scan --tool promptfoo --mode defense_in_depth

      - name: Execute PyRIT Autonomous Red-Teaming
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFENSE_MODE: defense_in_depth
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "[!] Notice: GROQ_API_KEY secret not found in repository. Running PyRIT in mock mode..."
            export MOCK_MODE=true
          fi
          python main.py scan --tool pyrit --mode defense_in_depth

      - name: Correlate Findings
        run: |
          python main.py correlate

      - name: Upload Security Assessment Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-forge-security-audit-artifacts
          path: |
            reports/
            results/promptfoo_report.json
            results/pyrit/
            results/garak/
          retention-days: 30

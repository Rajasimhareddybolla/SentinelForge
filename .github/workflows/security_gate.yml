name: SentinelForge AI Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-security-evaluation:
    name: Automated AI Red-Teaming & Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated unit tests
        run: |
          python -m pytest tests/ -v

      - name: Execute Red-Team Retest & Enforce Security Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFENSE_MODE: defense_in_depth
        run: |
          # If GROQ_API_KEY is not configured in repository secrets (e.g. fork PR), run in mock verification mode
          if [ -z "$GROQ_API_KEY" ]; then
            echo "[!] Notice: GROQ_API_KEY secret not found. Running gate in mock mode to validate architecture..."
            python -c "
          import os, asyncio
          from app.northwind.config import get_settings
          settings = get_settings()
          settings.mock_mode = True
          "
          fi
          python retest.py --mode defense_in_depth --direct --fail-on-regression --github-summary

      - name: Upload Security Assessment Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-forge-security-audit-artifacts
          path: |
            results/retest_report.md
            results/report.md
            results/retest/*.json
            results/baseline/*.json
          retention-days: 30

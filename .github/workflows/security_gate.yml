name: SentinelForge AI Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-security-evaluation:
    name: Automated AI Red-Teaming & Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated unit tests
        run: |
          python -m pytest tests/ -v

      - name: Execute Red-Team Retest & Enforce Security Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFENSE_MODE: defense_in_depth
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "[!] Notice: GROQ_API_KEY secret not found in repository. Running in architecture mock mode..."
            export MOCK_MODE=true
          else
            echo "[+] Found GROQ_API_KEY secret. Executing live Groq model evaluation..."
          fi
          python retest.py --mode defense_in_depth --direct --fail-on-regression --github-summary

      - name: Execute PyRIT Multi-Turn Red-Teaming Scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEFENSE_MODE: defense_in_depth
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "[!] Notice: GROQ_API_KEY secret not found in repository. Running PyRIT in mock mode..."
            export MOCK_MODE=true
          fi
          python run_pyrit.py --mode defense_in_depth --direct --fail-on-compromise

      - name: Upload Security Assessment Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-forge-security-audit-artifacts
          path: |
            results/retest_report.md
            results/report.md
            results/pyrit_report.md
            results/retest/*.json
            results/baseline/*.json
            results/pyrit/*.json
          retention-days: 30

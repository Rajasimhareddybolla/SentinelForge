name: AI Code and Security Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI PR Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI PR Reviewer
        uses: coderabbitai/openai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action needs an OpenAI API Key to perform the review.
          # You can set OPENAI_API_KEY in your repository's Settings > Secrets and variables > Actions
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          openai_light_model: gpt-4o-mini
          openai_heavy_model: gpt-4o
          system_message: |
            You are an expert AI code reviewer focused on Application Security and Code Quality.
            Your primary goal is to review the code changes in this pull request and provide feedback on:
            1. **Security Vulnerabilities**: Actively look for security flaws, such as injection risks (SQLi, XSS, Command Injection), authentication/authorization bypasses, data leaks, insecure direct object references, or other critical security risks.
            2. **Code Quality**: Ensure the code is readable, maintainable, performant, and adheres to software engineering best practices.
            
            Provide clear, actionable feedback and suggest specific code improvements where possible. Be concise and focus on high-impact issues. Do not nitpick trivial formatting issues.

